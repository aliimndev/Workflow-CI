name: CI-MLflow-Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      
      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas numpy
      
      - name: Run MLflow Project
        working-directory: ./MLProject
        run: |
          mlflow run . --experiment-name=ci_experiment
          echo "RUN_ID=$(cat run_id.txt)" >> $GITHUB_ENV
      
      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: mlruns/
      
      - name: Build Docker Image
        run: |
          mlflow models build-docker -m "file://${{ github.workspace }}/mlruns/1/${{ env.RUN_ID }}/artifacts/model" -n "telco-churn-model:latest"
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        run: |
          docker tag telco-churn-model:latest ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
