name: CI-MLflow-Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: echo "Starting CI-MLflow-Docker workflow"
      
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      
      - name: Check Env
        run: |
          echo "Python version: $(python --version)"
          echo "Working directory: $(pwd)"
      
      - name: Install dependencies
        run: pip install --upgrade pip
      
      - name: Run mlflow project
        working-directory: ./MLProject
        run: python modelling.py
      
      - name: Get latest MLflow run_id
        id: get_run_id
        working-directory: ./MLProject
        run: |
          echo "RUN_ID=$(cat run_id.txt)" >> $GITHUB_OUTPUT
      
      - name: Install Python dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas numpy
      
      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          retention-days: 30
      
      - name: Prepare Docker context
        run: mv MLProject/mlruns .
      
      - name: Build Docker Model
        run: docker build --build-arg RUN_ID=${{ steps.get_run_id.outputs.RUN_ID }} -t telco-churn-model:latest .
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Tag Docker Image
        run: docker tag telco-churn-model:latest ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
      
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
      
      - name: Complete job
        run: echo "Workflow completed successfully"
