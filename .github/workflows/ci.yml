name: CI-MLflow-Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      
      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas numpy
      
      - name: Run MLflow Project
        working-directory: ./MLProject
        run: mlflow run . --experiment-name=ci_experiment --env-manager local
      
      - name: Get RUN_ID
        id: get_run_id
        working-directory: ./MLProject
        run: echo "RUN_ID=$(cat run_id.txt)" >> $GITHUB_OUTPUT
      
      - name: Prepare Docker context
        run: mv MLProject/mlruns .
      
      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/
      
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << DOCKERFILE
          FROM python:3.12.7-slim
          WORKDIR /app
          RUN pip install mlflow==2.19.0 scikit-learn pandas numpy
          COPY mlruns/ mlruns/
          ENV MLFLOW_TRACKING_URI=file:///app/mlruns
          ARG RUN_ID
          EXPOSE 8080
          CMD mlflow models serve -m "runs:/\${RUN_ID}/model" -h 0.0.0.0 -p 8080
          DOCKERFILE
      
      - name: Build Docker Image
        run: docker build --build-arg RUN_ID=${{ steps.get_run_id.outputs.RUN_ID }} -t telco-churn-model:latest .
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        run: |
          docker tag telco-churn-model:latest ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest