name: CI-MLflow-Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      
      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas numpy
      
      - name: Run modelling script
        working-directory: ./MLProject
        run: python modelling.py
      
      - name: Build Docker Image
        working-directory: ./MLProject
        run: |
          RUN_ID=$(cat run_id.txt)
          MODEL_PATH=$(find ../mlruns -name "model" -type d | grep "$RUN_ID")
          echo "Model path: $MODEL_PATH"
          mlflow models build-docker -m "file://$(realpath $MODEL_PATH)" -n "telco-churn-model:latest"
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        run: |
          docker tag telco-churn-model:latest ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest